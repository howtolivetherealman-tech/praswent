            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div class="lg:col-span-7 bg-white rounded-xl border border-[#E5DEC9] overflow-hidden">
                <div class="aspect-video bg-black">
                  <iframe class="w-full h-full" src="https://www.youtube.com/embed/${featured.videoId}?rel=0" allowfullscreen></iframe>
                </div>
                <div class="p-5">
                  <span class="text-xs font-bold text-[#991B1B]">#1 · Sadguru Naatu Vaidyam</span>
                  <h3 class="font-serif text-xl font-bold mt-1">${featured.title[lang] || featured.title.te}</h3>
                  <p class="text-sm text-[#574B42] mt-1">${featured.description[lang] || featured.description.te}</p>
                </div>
              </div>
              <div class="lg:col-span-5 space-y-3 max-h-[420px] overflow-y-auto">
                ${sortedVideos.map((v, i) => `
                  <button onclick="selectVid('${v.videoId}')" class="w-full text-left p-3 rounded-xl border ${v.videoId === featured.videoId ? 'bg-white border-[#991B1B]' : 'bg-white/70 border-[#E5DEC9]'} flex items-center gap-3">
                    <img src="https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg" class="w-24 aspect-video rounded object-cover shrink-0" />
                    <div>
                      <span class="text-xs font-bold text-[#991B1B]">#${i + 1} ${i === 0 ? '· Newest 1st' : ''}</span>
                      <h4 class="text-sm font-semibold line-clamp-2">${v.title[lang] || v.title.te}</h4>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          </section>

          <section id="services" class="space-y-6">
            <h2 class="font-serif text-2xl sm:text-3xl font-bold">${te ? '1. సమస్యలు & తాంత్రిక జ్యోతిష్య పరిష్కారాలు' : '1. Tantric, Astrological & Herbal Remedies'}</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              ${store.services.map(s => `
                <div class="p-5 bg-white rounded-xl border border-[#E5DEC9] flex flex-col justify-between">
                  <div>
                    <span class="text-xs font-mono font-bold text-[#991B1B]">#${s.number}</span>
                    <h3 class="font-serif text-lg font-bold mt-1">${s.title[lang] || s.title.te}</h3>
                    <p class="text-sm text-[#574B42] mt-2">${s.description[lang] || s.description.te}</p>
                  </div>
                  <a href="tel:${PHONE}" class="mt-4 inline-block text-xs font-bold text-[#991B1B] hover:underline">📞 ${te ? 'పరిష్కారం కోసం కాల్ చేయండి: ' + PHONE : 'Call for Solution: ' + PHONE}</a>
                </div>
              `).join('')}
            </div>
          </section>

          <section id="yantras" class="space-y-6">
            <h2 class="font-serif text-2xl sm:text-3xl font-bold">${te ? '2. అభిమంత్రించిన యంత్రములు & పూజా సామాగ్రి' : '2. Consecrated Copper Yantras & Puja Samagri'}</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
              ${store.products.map(p => `
                <div class="p-5 bg-white rounded-xl border border-[#E5DEC9] flex flex-col justify-between">
                  <div>
                    <img src="${p.imageUrl || YANTRA_SVG}" class="w-full aspect-video object-cover rounded-lg mb-3 bg-[#1C1613]" />
                    <h3 class="font-serif text-lg font-bold">${p.name[lang] || p.name.te}</h3>
                    <p class="text-xs text-[#574B42] mt-2">${p.description[lang] || p.description.te}</p>
                  </div>
                  <div class="mt-4 pt-3 border-t border-[#E5DEC9] flex items-center justify-between">
                    <span class="font-mono font-bold text-[#991B1B]">₹${p.price}</span>
                    <a href="https://wa.me/91${PHONE}?text=${encodeURIComponent(p.name.te)}" target="_blank" class="px-3 py-1.5 bg-[#991B1B] text-white text-xs font-semibold rounded-lg">${te ? 'ఆర్డర్ చేయండి' : 'Order'}</a>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <section id="herbs" class="space-y-6">
            <h2 class="font-serif text-2xl sm:text-3xl font-bold">${te ? '3. ఆయుర్వేద మూలికలు & మందుల తయారీ విధానం' : '3. Pure Forest Herbs & Traditional Formulations'}</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
              ${store.herbs.map(h => `
                <div class="p-5 bg-white rounded-xl border border-[#E5DEC9]">
                  <img src="${h.imageUrl || HERB_SVG}" class="w-full aspect-video object-cover rounded-lg mb-3 bg-[#1E2923]" />
                  <h3 class="font-serif text-lg font-bold text-[#1C1613]">${h.name[lang] || h.name.te}</h3>
                  <p class="text-xs text-[#574B42] mt-2">${h.benefits[lang] || h.benefits.te}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <section id="contact" class="p-6 sm:p-8 bg-white rounded-2xl border border-[#E5DEC9] flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
              <h2 class="font-serif text-2xl font-bold">${te ? 'శ్రీనివాస్ మహారాజ్ గారిని నేరుగా సంప్రదించండి' : 'Direct Consultation with Srinivas Maharaj'}</h2>
              <p class="text-sm text-[#574B42] mt-1">${te ? 'అన్ని సమస్యలకు పూర్తి గోప్యతతో 100% పరిష్కారం చూపబడును.' : '100% Confidential Tantric, Astrological & Herbal Care.'}</p>
            </div>
            <div class="flex flex-wrap gap-3">
              <a href="tel:${PHONE}" class="px-6 py-3 bg-[#991B1B] text-white font-bold rounded-xl">📞 +91 ${PHONE}</a>
              <a href="https://wa.me/91${PHONE}" target="_blank" class="px-6 py-3 bg-[#15803D] text-white font-bold rounded-xl">💬 WhatsApp</a>
            </div>
          </section>
        </main>

        <footer class="bg-[#1C1613] text-white/80 py-10 mt-12">
          <div class="max-w-[1200px] mx-auto px-4 sm:px-6 flex flex-wrap items-center justify-between gap-4 text-xs">
            <p>© సద్గురు నాటు వైద్యం (Sadguru Natu Vaidyam) — శ్రీనివాస్ మహారాజ్ | Contact: ${PHONE}</p>
            <div class="flex items-center gap-4">
              <a href="${store.channelUrl}" target="_blank" class="text-[#FDE68A] underline">Official YouTube Channel</a>
              <button onclick="openAdmin('videos')" class="text-[#FDE68A] underline">Admin Panel</button>
            </div>
          </div>
        </footer>

        ${adminModalOpen ? `
          <div class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-5 max-h-[90vh] overflow-y-auto">
              <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-serif text-xl font-bold">${te ? 'అడ్మిన్ కంట్రోల్ ప్యానెల్' : 'Admin Control Panel'}</h3>
                <button onclick="closeAdmin()" class="px-3 py-1 bg-gray-100 rounded-lg text-sm font-bold">✕</button>
              </div>
              ${!isAdmin ? `
                <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                  <label class="block text-sm font-semibold">${te ? 'అడ్మిన్ పాస్‌వర్డ్ నమోదు చేయండి' : 'Enter Admin Password'}</label>
                  <input id="admin-pwd" type="password" required placeholder="Password..." class="w-full px-4 py-2.5 border rounded-lg" />
                  <button type="submit" class="w-full py-2.5 bg-[#991B1B] text-white font-bold rounded-lg">${te ? 'లాగిన్ (Unlock Admin)' : 'Unlock Admin Panel'}</button>
                </form>
              ` : `
                <div class="space-y-6">
                  <div class="p-4 bg-[#FAF7F2] rounded-xl border space-y-2">
                    <label class="block text-xs font-bold">${te ? 'వెబ్‌సైట్ లోగో మార్చండి (Desktop/Mobile Gallery Upload)' : 'Upload Website Logo from Device'}</label>
                    <input type="file" accept="image/*" onchange="handleLogoFile(this)" class="text-xs" />
                  </div>
                  <form onsubmit="handleAddVideo(event)" class="p-4 bg-[#FAF7F2] rounded-xl border space-y-3">
                    <h4 class="text-sm font-bold text-[#991B1B]">${te ? 'కొత్త యూట్యూబ్ వీడియో జోడించండి (1st స్థానంలో కనిపిస్తుంది)' : 'Add New YouTube Video (Appears #1)'}</h4>
                    <input id="v-url" type="text" required placeholder="https://www.youtube.com/watch?v=..." class="w-full px-3 py-2 border rounded text-sm" />
                    <input id="v-title" type="text" placeholder="వీడియో టైటిల్ (Title in Telugu)" class="w-full px-3 py-2 border rounded text-sm" />
                    <input id="v-desc" type="text" placeholder="వివరణ (Description)" class="w-full px-3 py-2 border rounded text-sm" />
                    <button type="submit" class="px-4 py-2 bg-[#991B1B] text-white text-xs font-bold rounded-lg">+ ${te ? 'వీడియో 1st స్థానంలో యాడ్ చేయి' : 'Add Video #1'}</button>
                  </form>
                  <form onsubmit="handleAddService(event)" class="p-4 bg-[#FAF7F2] rounded-xl border space-y-3">
                    <h4 class="text-sm font-bold text-[#991B1B]">${te ? 'కొత్త సేవ / పరిష్కారం జోడించండి' : 'Add New Service'}</h4>
                    <input id="s-title" type="text" required placeholder="సమస్య & పరిష్కారం పేరు" class="w-full px-3 py-2 border rounded text-sm" />
                    <input id="s-desc" type="text" required placeholder="పూర్తి వివరణ" class="w-full px-3 py-2 border rounded text-sm" />
                    <button type="submit" class="px-4 py-2 bg-[#15803D] text-white text-xs font-bold rounded-lg">+ ${te ? 'సేవ జోడించు' : 'Add Service'}</button>
                  </form>
                </div>
              `}
            </div>
          </div>
        ` : ''}
      `;
    }

    render();
  </script>
</body>
</html>
